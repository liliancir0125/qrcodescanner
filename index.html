<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>舊 iPad 專用 QR 掃描器</title>
    <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
    <style>
        body { font-family: sans-serif; text-align: center; padding: 30px; background: #f7f7f7; color: #333; }
        .btn { font-size: 20px; padding: 20px 30px; background: #007aff; color: white; border: none; border-radius: 14px; cursor: pointer; width: 90%; max-width: 350px; margin: 15px 0; font-weight: bold; }
        .btn:disabled { background: #b0c4de; }
        #loadingBox { font-size: 18px; color: #007aff; margin-top: 20px; display: none; font-weight: bold; }
        #resultBox { margin-top: 25px; padding: 20px; background: white; border-radius: 12px; border: 1px solid #ddd; word-break: break-all; display: none; text-align: left; }
        #resultText { font-size: 18px; margin-bottom: 15px; }
        #resultLink { display: inline-block; color: white; background: #34c759; padding: 12px 20px; border-radius: 8px; text-decoration: none; font-size: 18px; font-weight: bold; }
        canvas { display: none; }
        .hint { font-size: 16px; color: #666; line-height: 1.5; margin-bottom: 20px; }
    </style>
</head>
<body>

    <h2>QR 掃描小幫手</h2>
    <p class="hint">點擊下方按鈕直接拍照，系統會自動縮小並解碼：</p>

    <input type="file" id="fileInput" accept="image/*" capture="environment" style="display:none;" onchange="handleImage(this)">
    
    <button id="scanBtn" class="btn" onclick="document.getElementById('fileInput').click()">直接開啟相機拍照</button>

    <!-- 新增的讀取中提示 -->
    <div id="loadingBox">🔄 正在處理與縮小照片，請稍候...</div>

    <div id="resultBox">
        <h3>辨識結果：</h3>
        <p id="resultText"></p>
        <a id="resultLink" href="#" target="_blank" style="display:none;">前往連結</a>
    </div>

    <canvas id="canvas"></canvas>

    <script>
        function handleImage(input) {
            if (input.files && input.files[0]) {
                // 顯示讀取中提示，並按鈕反灰防止重複點擊
                document.getElementById('loadingBox').style.display = "block";
                document.getElementById('scanBtn').disabled = true;
                document.getElementById('resultBox').style.display = "none";

                var reader = new FileReader();
                reader.onload = function (e) {
                    var img = new Image();
                    img.onload = function () {
                        var canvas = document.getElementById('canvas');
                        var ctx = canvas.getContext('2d');
                        
                        var max_size = 800;
                        var width = img.width;
                        var height = img.height;
                        if (width > height) {
                            if (width > max_size) { height *= max_size / width; width = max_size; }
                        } else {
                            if (height > max_size) { width *= max_size / height; height = max_size; }
                        }
                        
                        canvas.width = width;
                        canvas.height = height;
                        ctx.drawImage(img, 0, 0, width, height);
                        
                        var imageData = ctx.getImageData(0, 0, width, height);
                        var code = jsQR(imageData.data, imageData.width, imageData.height);
                        
                        // 隱藏讀取中提示，恢復按鈕
                        document.getElementById('loadingBox').style.display = "none";
                        document.getElementById('scanBtn').disabled = false;
                        
                        var box = document.getElementById('resultBox');
                        var textElem = document.getElementById('resultText');
                        var linkElem = document.getElementById('resultLink');
                        
                        box.style.display = "block";
                        if (code) {
                            textElem.innerText = code.data;
                            if (code.data.startsWith('http://') || code.data.startsWith('https://')) {
                                linkElem.href = code.data;
                                linkElem.style.display = "inline-block";
                                linkElem.innerText = "點擊前往網址";
                            } else {
                                linkElem.style.display = "none";
                            }
                        } else {
                            textElem.innerText = "無法辨識，請確保 QR Code 清晰、沒有反光後重試。";
                            linkElem.style.display = "none";
                        }
                    }
                    img.src = e.target.result;
                }
                reader.readAsDataURL(input.files[0]);
            }
        }
    </script>
</body>
</html>
